<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0891b2" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Environment Canvas Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>

  <!-- Top Header Scene Pill -->
  <g transform="translate(35, 18)">
    <rect x="0" y="0" width="380" height="42" rx="21" fill="#ffffff" stroke="#0891b2" stroke-width="1.8" filter="url(#shadow)"/>
    <circle cx="21" cy="21" r="12" fill="#0891b2" fill-opacity="0.14"/>
    <circle cx="21" cy="21" r="5" fill="#0891b2"/>
    <text x="42" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#0891b2">Social Exclusion &amp; Isolation</text>
  </g>

  <!-- Top Right Variant Counter Badge -->
  <g transform="translate(615, 20)">
    <rect x="0" y="0" width="150" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="20" cy="19" r="6" fill="#64748b"/>
    <text x="35" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#334155">Scene 5 of 6</text>
  </g>

  <!-- Core Scene Illustration Graphics -->
  
        <!-- Society Office Whiteboard -->
        <rect x="180" y="80" width="440" height="260" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="4" filter="url(#cardShadow)"/>
        <text x="210" y="115" font-family="sans-serif" font-size="13" font-weight="800" fill="#0f172a">ANNUAL SYMPOSIUM COMMITTEE ROSTER</text>
        <line x1="210" y1="125" x2="590" y2="125" stroke="#e2e8f0" stroke-width="2"/>

        <!-- Team Lists -->
        <text x="210" y="150" font-family="sans-serif" font-size="11" font-weight="700" fill="#0891b2">Logistics Team:</text>
        <text x="220" y="170" font-family="sans-serif" font-size="10.5" fill="#475569">• Hamza K. (Lead)</text>
        <text x="220" y="188" font-family="sans-serif" font-size="10.5" fill="#475569">• Maryam A.</text>

        <text x="210" y="218" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748b">Media &amp; Outreach:</text>
        <!-- Strikethrough Removed Name -->
        <text x="220" y="238" font-family="sans-serif" font-size="10.5" fill="#ef4444" text-decoration="line-through">• Arham Tariq (REMOVED)</text>
        <line x1="220" y1="234" x2="350" y2="234" stroke="#ef4444" stroke-width="2"/>
        <text x="220" y="256" font-family="sans-serif" font-size="10.5" fill="#475569">• Bilal S.</text>

        <!-- Red Strikethrough Stamp Overlay -->
        <g transform="translate(420, 160)" rotate="12">
          <rect x="0" y="0" width="140" height="40" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
          <text x="70" y="25" font-family="sans-serif" font-size="12" font-weight="800" fill="#ef4444" text-anchor="middle">DROPPED</text>
        </g>

        <!-- Wastebasket Below with discarded Badge -->
        <path d="M600 320 L640 320 L630 380 L610 380 Z" fill="#64748b"/>
        <rect x="605" y="310" width="30" height="20" rx="3" fill="#ef4444"/>
        

  <!-- Bottom Context Banner -->
  <g transform="translate(40, 435)">
    <rect x="0" y="0" width="720" height="44" rx="12" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="14" y="12" width="5" height="20" rx="2.5" fill="url(#accentGrad)"/>
    <text x="30" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b">
      Scenario Illustration: Deliberate Removal from Department Committee
    </text>
  </g>
</svg>