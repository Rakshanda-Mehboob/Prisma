<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#fdf2f8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#9333ea" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Environment Canvas Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>

  <!-- Top Header Scene Pill -->
  <g transform="translate(35, 18)">
    <rect x="0" y="0" width="380" height="42" rx="21" fill="#ffffff" stroke="#9333ea" stroke-width="1.8" filter="url(#shadow)"/>
    <circle cx="21" cy="21" r="12" fill="#9333ea" fill-opacity="0.14"/>
    <circle cx="21" cy="21" r="5" fill="#9333ea"/>
    <text x="42" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#9333ea">Humiliating Visual Media</text>
  </g>

  <!-- Top Right Variant Counter Badge -->
  <g transform="translate(615, 20)">
    <rect x="0" y="0" width="150" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="20" cy="19" r="6" fill="#db2777"/>
    <text x="35" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#334155">Scene 1 of 6</text>
  </g>

  <!-- Core Scene Illustration Graphics -->
  
        <!-- Blackboard in Classroom Background -->
        <rect x="150" y="80" width="500" height="160" rx="8" fill="#14532d" stroke="#166534" stroke-width="4"/>
        <text x="180" y="120" font-family="sans-serif" font-size="14" fill="#86efac">Econ 201: Fiscal Policy Seminar</text>

        <!-- Targeted Presenter Tripping over Cord -->
        <g transform="translate(370, 160)">
          <!-- Tangled floor cable -->
          <path d="M30 140 Q45 130 60 140 Q75 145 90 135" fill="none" stroke="#000000" stroke-width="4"/>
          <!-- Falling posture -->
          <circle cx="40" cy="30" r="22" fill="#fed7aa"/>
          <rect x="25" y="52" width="35" height="65" rx="6" fill="#9333ea"/>
          <path d="M10 70 L-20 90" stroke="#fed7aa" stroke-width="7" stroke-linecap="round"/>
        </g>

        <!-- Foreground Smartphone Framing the Mishap with Live Stream Bar -->
        <g transform="translate(260, 190)" filter="url(#cardShadow)">
          <rect x="0" y="0" width="160" height="150" rx="14" fill="#0f172a" stroke="#db2777" stroke-width="2.5"/>
          <rect x="8" y="12" width="144" height="110" rx="6" fill="#1e293b"/>
          <rect x="16" y="20" width="45" height="16" rx="3" fill="#dc2626"/>
          <text x="38" y="32" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle">LIVE 184</text>
          <!-- Focus box framing the fall -->
          <rect x="50" y="45" width="60" height="50" fill="none" stroke="#eab308" stroke-width="1.8" stroke-dasharray="4,2"/>
        </g>
        

  <!-- Bottom Context Banner -->
  <g transform="translate(40, 435)">
    <rect x="0" y="0" width="720" height="44" rx="12" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="14" y="12" width="5" height="20" rx="2.5" fill="url(#accentGrad)"/>
    <text x="30" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b">
      Scenario Illustration: Recording and Streaming an Accidental Classroom Stumble
    </text>
  </g>
</svg>