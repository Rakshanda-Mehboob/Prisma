<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#b91c1c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Environment Canvas Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>

  <!-- Top Header Scene Pill -->
  <g transform="translate(35, 18)">
    <rect x="0" y="0" width="380" height="42" rx="21" fill="#ffffff" stroke="#b91c1c" stroke-width="1.8" filter="url(#shadow)"/>
    <circle cx="21" cy="21" r="12" fill="#b91c1c" fill-opacity="0.14"/>
    <circle cx="21" cy="21" r="5" fill="#b91c1c"/>
    <text x="42" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#b91c1c">Digital Intimidation &amp; Threats</text>
  </g>

  <!-- Top Right Variant Counter Badge -->
  <g transform="translate(615, 20)">
    <rect x="0" y="0" width="150" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="20" cy="19" r="6" fill="#475569"/>
    <text x="35" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#334155">Scene 3 of 6</text>
  </g>

  <!-- Core Scene Illustration Graphics -->
  
        <!-- Dark Terminal Screen -->
        <rect x="180" y="80" width="440" height="280" rx="12" fill="#090d16" stroke="#ef4444" stroke-width="3" filter="url(#cardShadow)"/>
        
        <!-- Terminal Header -->
        <rect x="180" y="80" width="440" height="35" rx="12 12 0 0" fill="#1e293b"/>
        <circle cx="202" cy="97" r="4" fill="#ef4444"/>
        <circle cx="215" cy="97" r="4" fill="#f59e0b"/>
        <text x="240" y="102" font-family="monospace" font-size="11" fill="#94a3b8">doxx_payload_target_01.sh</text>

        <!-- Exposed Personal Information in Terminal -->
        <g transform="translate(210, 130)" font-family="monospace" font-size="10.5">
          <text x="0" y="18" fill="#ef4444">[TARGET LOCATED] CNIC: 42101-*******-3</text>
          <text x="0" y="38" fill="#38bdf8">RESIDENTIAL ADDRESS: House 14-B, Sector G-10</text>
          <text x="0" y="58" fill="#38bdf8">PHONE: +92 300 *******</text>
          <text x="0" y="78" fill="#38bdf8">FAMILY CONTACTS: Leaked from student portal</text>
        </g>

        <!-- Ransom / Intimidation Dialog Box Overlay -->
        <g transform="translate(230, 220)">
          <rect x="0" y="0" width="340" height="60" rx="6" fill="#7f1d1d" stroke="#fca5a5" stroke-width="1.5"/>
          <text x="170" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">"WITHDRAW REPORT OR THIS LEAKS IN 1 HOUR"</text>
          <text x="170" y="44" font-family="sans-serif" font-size="9.5" fill="#fecaca" text-anchor="middle">Timer: 00:58:24 remaining • Do not test us</text>
        </g>
        

  <!-- Bottom Context Banner -->
  <g transform="translate(40, 435)">
    <rect x="0" y="0" width="720" height="44" rx="12" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="14" y="12" width="5" height="20" rx="2.5" fill="url(#accentGrad)"/>
    <text x="30" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b">
      Scenario Illustration: Doxxing Threat and Personal Address Exposure
    </text>
  </g>
</svg>