<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#faf5ff"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ea580c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Environment Canvas Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>

  <!-- Top Header Scene Pill -->
  <g transform="translate(35, 18)">
    <rect x="0" y="0" width="380" height="42" rx="21" fill="#ffffff" stroke="#ea580c" stroke-width="1.8" filter="url(#shadow)"/>
    <circle cx="21" cy="21" r="12" fill="#ea580c" fill-opacity="0.14"/>
    <circle cx="21" cy="21" r="5" fill="#ea580c"/>
    <text x="42" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ea580c">False Rumour &amp; Misinformation</text>
  </g>

  <!-- Top Right Variant Counter Badge -->
  <g transform="translate(615, 20)">
    <rect x="0" y="0" width="150" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="20" cy="19" r="6" fill="#7c3aed"/>
    <text x="35" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#334155">Scene 5 of 6</text>
  </g>

  <!-- Core Scene Illustration Graphics -->
  
        <!-- Hospital Nursing Station Counter -->
        <rect x="150" y="220" width="500" height="30" rx="4" fill="#64748b"/>
        <rect x="180" y="250" width="440" height="110" fill="#cbd5e1"/>

        <!-- Medical Patient Chart -->
        <g transform="translate(220, 110)" filter="url(#cardShadow)">
          <rect x="0" y="0" width="180" height="120" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
          <text x="15" y="25" font-family="sans-serif" font-size="10" font-weight="800" fill="#ea580c">PATIENT CHART #0412</text>
          <text x="15" y="42" font-family="sans-serif" font-size="9" fill="#334155">Attending Note: Routine check</text>
          <circle cx="150" cy="80" r="16" fill="#10b981" fill-opacity="0.2"/>
          <text x="150" y="85" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#10b981">✓</text>
        </g>

        <!-- Slanderous Chat Broadcast Overlaid -->
        <g transform="translate(420, 110)" filter="url(#cardShadow)">
          <rect x="0" y="0" width="220" height="110" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
          <circle cx="20" cy="20" r="10" fill="#7c3aed" fill-opacity="0.2"/>
          <text x="35" y="24" font-family="sans-serif" font-size="10" font-weight="700" fill="#7c3aed">WhatsApp Ward Group:</text>
          <text x="12" y="45" font-family="sans-serif" font-size="9.5" fill="#334155">"Did you see Hamza almost gave</text>
          <text x="12" y="60" font-family="sans-serif" font-size="9.5" fill="#334155">the wrong dosage today?</text>
          <text x="12" y="75" font-family="sans-serif" font-size="9.5" fill="#dc2626">He shouldn't pass rotation."</text>
          <text x="12" y="98" font-family="sans-serif" font-size="8.5" fill="#94a3b8">(Attending doctor had clarified false)</text>
        </g>
        

  <!-- Bottom Context Banner -->
  <g transform="translate(40, 435)">
    <rect x="0" y="0" width="720" height="44" rx="12" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="14" y="12" width="5" height="20" rx="2.5" fill="url(#accentGrad)"/>
    <text x="30" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b">
      Scenario Illustration: Medical Ward Routine Check Falsely Slandered as Fatal Error
    </text>
  </g>
</svg>