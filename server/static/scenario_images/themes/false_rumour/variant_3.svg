<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#faf5ff"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ea580c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Environment Canvas Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>

  <!-- Top Header Scene Pill -->
  <g transform="translate(35, 18)">
    <rect x="0" y="0" width="380" height="42" rx="21" fill="#ffffff" stroke="#ea580c" stroke-width="1.8" filter="url(#shadow)"/>
    <circle cx="21" cy="21" r="12" fill="#ea580c" fill-opacity="0.14"/>
    <circle cx="21" cy="21" r="5" fill="#ea580c"/>
    <text x="42" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ea580c">False Rumour &amp; Misinformation</text>
  </g>

  <!-- Top Right Variant Counter Badge -->
  <g transform="translate(615, 20)">
    <rect x="0" y="0" width="150" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="20" cy="19" r="6" fill="#7c3aed"/>
    <text x="35" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#334155">Scene 3 of 6</text>
  </g>

  <!-- Core Scene Illustration Graphics -->
  
        <!-- Instagram/Social Phone Layout -->
        <g transform="translate(260, 75)" filter="url(#cardShadow)">
          <rect x="0" y="0" width="280" height="340" rx="22" fill="#000000" stroke="#7c3aed" stroke-width="3"/>
          
          <!-- Profile Header -->
          <circle cx="35" cy="30" r="16" fill="#1e1b4b"/>
          <text x="35" y="35" font-family="sans-serif" font-size="14" text-anchor="middle">🎭</text>
          <text x="60" y="28" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Uni_Confessions_Official</text>
          <text x="60" y="42" font-family="sans-serif" font-size="9" fill="#a5b4fc">24k followers • Anonymous</text>

          <!-- Confession Text Post Card -->
          <rect x="15" y="60" width="250" height="170" rx="12" fill="#18181b" stroke="#27272a"/>
          <text x="25" y="85" font-family="sans-serif" font-size="11" font-weight="800" fill="#ea580c">#CONFESSION_8492</text>
          <text x="25" y="110" font-family="sans-serif" font-size="10.5" fill="#fafafa">"Everyone in CS Section B knows</text>
          <text x="25" y="128" font-family="sans-serif" font-size="10.5" fill="#fafafa">what Mahnoor did to get her</text>
          <text x="25" y="146" font-family="sans-serif" font-size="10.5" fill="#fafafa">internship offer. Totally unfair to</text>
          <text x="25" y="164" font-family="sans-serif" font-size="10.5" fill="#fafafa">deserving students. 🐍"</text>
          
          <line x1="25" y1="185" x2="255" y2="185" stroke="#27272a"/>
          <text x="25" y="205" font-family="sans-serif" font-size="9.5" fill="#e11d48">❤️ 412 likes • 89 comments</text>

          <!-- Reaction Bar Below -->
          <rect x="15" y="245" width="250" height="40" rx="8" fill="#27272a"/>
          <text x="30" y="270" font-family="sans-serif" font-size="11" fill="#a1a1aa">Add a comment...</text>
        </g>
        

  <!-- Bottom Context Banner -->
  <g transform="translate(40, 435)">
    <rect x="0" y="0" width="720" height="44" rx="12" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="14" y="12" width="5" height="20" rx="2.5" fill="url(#accentGrad)"/>
    <text x="30" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b">
      Scenario Illustration: Defamation on Anonymous Instagram Confession Page
    </text>
  </g>
</svg>