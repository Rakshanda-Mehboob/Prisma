<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563eb" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Environment Canvas Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>

  <!-- Top Header Scene Pill -->
  <g transform="translate(35, 18)">
    <rect x="0" y="0" width="380" height="42" rx="21" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow)"/>
    <circle cx="21" cy="21" r="12" fill="#2563eb" fill-opacity="0.14"/>
    <circle cx="21" cy="21" r="5" fill="#2563eb"/>
    <text x="42" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#2563eb">Cyberbullying Awareness &amp; Safety</text>
  </g>

  <!-- Top Right Variant Counter Badge -->
  <g transform="translate(615, 20)">
    <rect x="0" y="0" width="150" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="20" cy="19" r="6" fill="#059669"/>
    <text x="35" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#334155">Scene 5 of 6</text>
  </g>

  <!-- Core Scene Illustration Graphics -->
  
        <!-- Smartphone Stream Centered on Constructive Intervention -->
        <g transform="translate(250, 75)" filter="url(#cardShadow)">
          <rect x="0" y="0" width="300" height="340" rx="24" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
          <rect x="0" y="0" width="300" height="45" rx="24 24 0 0" fill="#2563eb"/>
          <text x="30" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Classroom Group Chat (92)</text>

          <!-- Rude Message Being Shut Down -->
          <rect x="15" y="60" width="200" height="36" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
          <text x="25" y="76" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#b91c1c">Shahmeer:</text>
          <text x="25" y="88" font-family="sans-serif" font-size="9.5" fill="#7f1d1d">"Who told him he can speak in class? 🙄"</text>

          <!-- UPSTANDER INTERVENTION BUBBLE -->
          <g transform="translate(30, 115)">
            <rect x="0" y="0" width="255" height="90" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
            <circle cx="20" cy="22" r="10" fill="#059669" fill-opacity="0.2"/>
            <text x="35" y="25" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#059669">Zainab (Upstander):</text>
            <text x="12" y="48" font-family="sans-serif" font-size="10" font-weight="600" fill="#065f46">"Let's keep this space respectful."</text>
            <text x="12" y="64" font-family="sans-serif" font-size="9.5" fill="#047857">"Everyone has the right to contribute without</text>
            <text x="12" y="78" font-family="sans-serif" font-size="9.5" fill="#047857">being put down. This is an academic group."</text>
          </g>

          <!-- Peer Agreement Endorsements Below -->
          <g transform="translate(45, 225)">
            <rect x="0" y="0" width="180" height="30" rx="15" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
            <text x="20" y="20" font-family="sans-serif" font-size="11">👍 24</text>
            <text x="70" y="20" font-family="sans-serif" font-size="11">❤️ 16</text>
            <text x="120" y="20" font-family="sans-serif" font-size="11">👏 19</text>
          </g>
        </g>
        

  <!-- Bottom Context Banner -->
  <g transform="translate(40, 435)">
    <rect x="0" y="0" width="720" height="44" rx="12" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="14" y="12" width="5" height="20" rx="2.5" fill="url(#accentGrad)"/>
    <text x="30" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b">
      Scenario Illustration: Public Rejection of Bullying Inside Batch Chat
    </text>
  </g>
</svg>