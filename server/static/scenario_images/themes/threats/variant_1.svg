<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#b91c1c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" rx="20" fill="url(#bgGrad)"/>

  <!-- Decorative Background Grid Lines -->
  <g stroke="#cbd5e1" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="4,6">
    <line x1="60" y1="0" x2="60" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="740" y1="0" x2="740" y2="500"/>
    <line x1="0" y1="80" x2="800" y2="800"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
  </g>

  <!-- Top Theme Header Pill -->
  <g transform="translate(50, 32)">
    <rect x="0" y="0" width="310" height="42" rx="21" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="22" cy="21" r="14" fill="#b91c1c" fill-opacity="0.12"/>
    <text x="22" y="26" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">⚠️</text>
    <text x="46" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#b91c1c">Digital Intimidation & Threats</text>
  </g>

  <!-- Top Right Scenario Context Tag -->
  <g transform="translate(580, 36)">
    <rect x="0" y="0" width="170" height="34" rx="17" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <circle cx="16" cy="17" r="6" fill="#475569"/>
    <text x="32" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">Variant 1 of 3</text>
  </g>

  <!-- Central Visual Scene Art -->
  
        <!-- Phone Device Frame -->
        <rect x="290" y="80" width="220" height="350" rx="28" fill="#ffffff" stroke="#b91c1c" stroke-width="4" filter="url(#shadow)"/>
        <rect x="305" y="115" width="190" height="275" rx="16" fill="#fef2f2"/>
        <!-- Phone Speaker & Camera -->
        <line x1="375" y1="98" x2="425" y2="98" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
        <circle cx="360" cy="98" r="3.5" fill="#94a3b8"/>
        <!-- Incoming Alert Banner -->
        <rect x="320" y="135" width="160" height="48" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2"/>
        <circle cx="340" cy="159" r="12" fill="#475569" fill-opacity="0.2"/>
        <text x="340" y="164" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#475569">!</text>
        <rect x="360" y="148" width="105" height="8" rx="4" fill="#b91c1c"/>
        <rect x="360" y="162" width="75" height="6" rx="3" fill="#94a3b8"/>
        <!-- Message Bubbles -->
        <rect x="320" y="198" width="130" height="36" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
        <rect x="330" y="210" width="90" height="6" rx="3" fill="#64748b"/>
        <rect x="330" y="220" width="60" height="6" rx="3" fill="#94a3b8"/>
        
        <rect x="350" y="248" width="130" height="42" rx="12" fill="#b91c1c" fill-opacity="0.12" stroke="#b91c1c" stroke-width="1.5"/>
        <rect x="362" y="260" width="100" height="6" rx="3" fill="#b91c1c"/>
        <rect x="362" y="272" width="70" height="6" rx="3" fill="#b91c1c" fill-opacity="0.7"/>

        <rect x="320" y="304" width="145" height="40" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
        <rect x="330" y="316" width="110" height="6" rx="3" fill="#64748b"/>
        <rect x="330" y="328" width="80" height="6" rx="3" fill="#94a3b8"/>

        <!-- Ambient Side Floating Reaction Icons -->
        <g filter="url(#glow)">
          <circle cx="210" cy="180" r="32" fill="#ffffff" stroke="#b91c1c" stroke-width="2.5"/>
          <text x="210" y="188" font-family="system-ui, sans-serif" font-size="22" text-anchor="middle">⚠️</text>

          <circle cx="590" cy="220" r="28" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
          <text x="590" y="228" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">💬</text>

          <circle cx="230" cy="320" r="24" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
          <text x="230" y="328" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">⚠️</text>

          <circle cx="570" cy="340" r="26" fill="#ffffff" stroke="#475569" stroke-width="2"/>
          <text x="570" y="347" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">📱</text>
        </g>
        

  <!-- Bottom Educational Insight Caption Bar -->
  <g transform="translate(100, 435)">
    <rect x="0" y="0" width="600" height="38" rx="12" fill="#ffffff" fill-opacity="0.9" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
    <rect x="12" y="10" width="5" height="18" rx="2.5" fill="url(#accentGrad)"/>
    <text x="28" y="24" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#475569">
      Theme Focus: Aggressive direct messages and coercive hostility
    </text>
  </g>
</svg>