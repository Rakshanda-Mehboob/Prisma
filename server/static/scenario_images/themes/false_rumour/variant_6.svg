<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#faf5ff"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ea580c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Environment Canvas Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>

  <!-- Top Header Scene Pill -->
  <g transform="translate(35, 18)">
    <rect x="0" y="0" width="380" height="42" rx="21" fill="#ffffff" stroke="#ea580c" stroke-width="1.8" filter="url(#shadow)"/>
    <circle cx="21" cy="21" r="12" fill="#ea580c" fill-opacity="0.14"/>
    <circle cx="21" cy="21" r="5" fill="#ea580c"/>
    <text x="42" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ea580c">False Rumour &amp; Misinformation</text>
  </g>

  <!-- Top Right Variant Counter Badge -->
  <g transform="translate(615, 20)">
    <rect x="0" y="0" width="150" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="20" cy="19" r="6" fill="#7c3aed"/>
    <text x="35" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#334155">Scene 6 of 6</text>
  </g>

  <!-- Core Scene Illustration Graphics -->
  
        <!-- Apartment Hallway Wall with Pinned Flyer -->
        <rect x="180" y="80" width="440" height="270" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3" filter="url(#cardShadow)"/>
        
        <!-- Pinned Accusatory Flyer -->
        <g transform="translate(240, 105)" filter="url(#shadow)">
          <!-- Push pin -->
          <circle cx="160" cy="8" r="6" fill="#dc2626"/>
          <rect x="0" y="10" width="320" height="140" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
          <text x="20" y="35" font-family="sans-serif" font-size="12" font-weight="800" fill="#b91c1c">⚠️ NOTICE TO APARTMENT RESIDENTS</text>
          <text x="20" y="58" font-family="sans-serif" font-size="10.5" fill="#334155">"Student in Flat 4B has refused to pay</text>
          <text x="20" y="74" font-family="sans-serif" font-size="10.5" fill="#334155">their shared utility bill and pocketed funds.</text>
          <text x="20" y="94" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b91c1c">Do not partner with them on housing!"</text>
          <text x="20" y="125" font-family="sans-serif" font-size="9" fill="#64748b">Verified receipt was already paid • Slander</text>
        </g>

        <!-- Whispering Roommates in Doorway on Left -->
        <circle cx="130" cy="220" r="18" fill="#fed7aa"/>
        <rect x="115" y="238" width="30" height="50" rx="6" fill="#ea580c"/>
        <circle cx="160" cy="225" r="18" fill="#fed7aa"/>
        <rect x="145" y="243" width="30" height="45" rx="6" fill="#7c3aed"/>
        

  <!-- Bottom Context Banner -->
  <g transform="translate(40, 435)">
    <rect x="0" y="0" width="720" height="44" rx="12" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="14" y="12" width="5" height="20" rx="2.5" fill="url(#accentGrad)"/>
    <text x="30" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b">
      Scenario Illustration: Fabricated Utility Theft Accusation in Shared Housing
    </text>
  </g>
</svg>