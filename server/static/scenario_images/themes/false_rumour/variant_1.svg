<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#faf5ff"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ea580c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Environment Canvas Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>

  <!-- Top Header Scene Pill -->
  <g transform="translate(35, 18)">
    <rect x="0" y="0" width="380" height="42" rx="21" fill="#ffffff" stroke="#ea580c" stroke-width="1.8" filter="url(#shadow)"/>
    <circle cx="21" cy="21" r="12" fill="#ea580c" fill-opacity="0.14"/>
    <circle cx="21" cy="21" r="5" fill="#ea580c"/>
    <text x="42" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ea580c">False Rumour &amp; Misinformation</text>
  </g>

  <!-- Top Right Variant Counter Badge -->
  <g transform="translate(615, 20)">
    <rect x="0" y="0" width="150" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="20" cy="19" r="6" fill="#7c3aed"/>
    <text x="35" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#334155">Scene 1 of 6</text>
  </g>

  <!-- Core Scene Illustration Graphics -->
  
        <!-- Examination Room Desks Silhouette -->
        <rect x="120" y="260" width="160" height="90" rx="6" fill="#e2e8f0" stroke="#cbd5e1"/>
        <rect x="320" y="260" width="160" height="90" rx="6" fill="#e2e8f0" stroke="#cbd5e1"/>
        <rect x="520" y="260" width="160" height="90" rx="6" fill="#e2e8f0" stroke="#cbd5e1"/>

        <!-- Central High Scoring Student -->
        <g transform="translate(370, 160)">
          <circle cx="30" cy="30" r="22" fill="#fed7aa"/>
          <path d="M12 20 Q30 8 48 20 Z" fill="#0f172a"/>
          <rect x="10" y="52" width="40" height="60" rx="6" fill="#ea580c"/>
          <!-- 100% Exam paper in hand -->
          <rect x="20" y="70" width="35" height="40" rx="3" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
          <text x="37" y="95" font-family="sans-serif" font-size="11" font-weight="800" fill="#10b981" text-anchor="middle">100%</text>
        </g>

        <!-- Dotted Whisper Trails from Left & Right -->
        <path d="M220 220 Q290 170 350 200" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6,4"/>
        <path d="M580 220 Q510 170 450 200" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6,4"/>

        <!-- Floating Rumour Speech Balloons -->
        <g transform="translate(140, 120)" filter="url(#cardShadow)">
          <rect x="0" y="0" width="170" height="50" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
          <text x="14" y="22" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#7c3aed">"He got the paper early!"</text>
          <text x="14" y="38" font-family="sans-serif" font-size="9.5" fill="#64748b">Unverified exam gossip</text>
        </g>

        <g transform="translate(490, 120)" filter="url(#cardShadow)">
          <rect x="0" y="0" width="170" height="50" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
          <text x="14" y="22" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#ea580c">"Teacher leaked questions"</text>
          <text x="14" y="38" font-family="sans-serif" font-size="9.5" fill="#64748b">Spreading across batch</text>
        </g>
        

  <!-- Bottom Context Banner -->
  <g transform="translate(40, 435)">
    <rect x="0" y="0" width="720" height="44" rx="12" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="14" y="12" width="5" height="20" rx="2.5" fill="url(#accentGrad)"/>
    <text x="30" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b">
      Scenario Illustration: Exam Paper Leak False Accusation Whisper Network
    </text>
  </g>
</svg>