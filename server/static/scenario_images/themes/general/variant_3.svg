<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563eb" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Environment Canvas Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>

  <!-- Top Header Scene Pill -->
  <g transform="translate(35, 18)">
    <rect x="0" y="0" width="380" height="42" rx="21" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow)"/>
    <circle cx="21" cy="21" r="12" fill="#2563eb" fill-opacity="0.14"/>
    <circle cx="21" cy="21" r="5" fill="#2563eb"/>
    <text x="42" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#2563eb">Cyberbullying Awareness &amp; Safety</text>
  </g>

  <!-- Top Right Variant Counter Badge -->
  <g transform="translate(615, 20)">
    <rect x="0" y="0" width="150" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="20" cy="19" r="6" fill="#059669"/>
    <text x="35" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#334155">Scene 3 of 6</text>
  </g>

  <!-- Core Scene Illustration Graphics -->
  
        <!-- Counselor Office Atmosphere -->
        <rect x="170" y="80" width="460" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" filter="url(#cardShadow)"/>
        
        <!-- Potted Peace Plant in Corner -->
        <path d="M200 310 L220 310 L215 340 L205 340 Z" fill="#b45309"/>
        <circle cx="210" cy="295" r="18" fill="#10b981"/>

        <!-- Coffee Table in Counseling Room -->
        <ellipse cx="400" cy="280" rx="100" ry="25" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
        
        <!-- Tablet with Incident Documentation Log -->
        <rect x="360" y="260" width="75" height="45" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
        <text x="397" y="280" font-family="sans-serif" font-size="8" font-weight="700" fill="#2563eb" text-anchor="middle">INCIDENT LOG</text>
        <line x1="370" y1="290" x2="425" y2="290" stroke="#10b981" stroke-width="2"/>

        <!-- Student on Left Sharing Experience -->
        <g transform="translate(250, 150)">
          <circle cx="25" cy="25" r="20" fill="#fed7aa"/>
          <rect x="8" y="45" width="34" height="75" rx="6" fill="#2563eb"/>
        </g>

        <!-- University Counselor on Right Listening Actively with Notepad -->
        <g transform="translate(480, 140)">
          <circle cx="25" cy="25" r="20" fill="#fed7aa"/>
          <path d="M10 18 Q25 8 40 18 Z" fill="#334155"/>
          <rect x="8" y="45" width="34" height="85" rx="6" fill="#059669"/>
          <!-- Holding clipboard -->
          <rect x="-10" y="65" width="22" height="30" rx="2" fill="#ffffff" stroke="#94a3b8"/>
        </g>
        

  <!-- Bottom Context Banner -->
  <g transform="translate(40, 435)">
    <rect x="0" y="0" width="720" height="44" rx="12" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="14" y="12" width="5" height="20" rx="2.5" fill="url(#accentGrad)"/>
    <text x="30" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b">
      Scenario Illustration: Reporting Cyberbullying Incident to University Counselor
    </text>
  </g>
</svg>