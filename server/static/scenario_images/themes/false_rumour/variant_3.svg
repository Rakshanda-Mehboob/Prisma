<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#faf5ff"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ea580c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" rx="20" fill="url(#bgGrad)"/>

  <!-- Decorative Background Grid Lines -->
  <g stroke="#cbd5e1" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="4,6">
    <line x1="60" y1="0" x2="60" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="740" y1="0" x2="740" y2="500"/>
    <line x1="0" y1="80" x2="800" y2="800"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
  </g>

  <!-- Top Theme Header Pill -->
  <g transform="translate(50, 32)">
    <rect x="0" y="0" width="310" height="42" rx="21" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="22" cy="21" r="14" fill="#ea580c" fill-opacity="0.12"/>
    <text x="22" y="26" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">📢</text>
    <text x="46" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ea580c">False Rumour & Misinformation</text>
  </g>

  <!-- Top Right Scenario Context Tag -->
  <g transform="translate(580, 36)">
    <rect x="0" y="0" width="170" height="34" rx="17" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <circle cx="16" cy="17" r="6" fill="#7c3aed"/>
    <text x="32" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">Variant 3 of 3</text>
  </g>

  <!-- Central Visual Scene Art -->
  
        <!-- Central Community / Chat Portal Frame -->
        <rect x="200" y="110" width="400" height="280" rx="24" fill="#ffffff" stroke="#ea580c" stroke-width="3" filter="url(#shadow)"/>
        <!-- Window Bar -->
        <path d="M200 134 Q200 110 224 110 L576 110 Q600 110 600 134 L600 148 L200 148 Z" fill="#ea580c"/>
        <circle cx="225" cy="129" r="4.5" fill="#ffffff" fill-opacity="0.7"/>
        <circle cx="240" cy="129" r="4.5" fill="#ffffff" fill-opacity="0.7"/>
        <circle cx="255" cy="129" r="4.5" fill="#ffffff" fill-opacity="0.7"/>
        <text x="400" y="134" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff" letter-spacing="1">CAMPUS DIGITAL NETWORK</text>

        <!-- Network User Nodes -->
        <circle cx="270" cy="210" r="28" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
        <text x="270" y="218" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">👤</text>
        
        <circle cx="530" cy="210" r="28" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5"/>
        <text x="530" y="218" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">👥</text>

        <!-- Connecting Data Wave -->
        <path d="M305 210 Q400 170 495 210" fill="none" stroke="#ea580c" stroke-width="3" stroke-dasharray="6,4"/>
        <circle cx="400" cy="190" r="16" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-width="2"/>
        <text x="400" y="196" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">📢</text>

        <!-- Dynamic Discussion Thread in Lower Center -->
        <rect x="235" y="260" width="330" height="50" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="255" cy="285" r="10" fill="#ea580c" fill-opacity="0.25"/>
        <rect x="274" y="278" width="180" height="7" rx="3.5" fill="#ea580c"/>
        <rect x="274" y="291" width="120" height="5" rx="2.5" fill="#94a3b8"/>

        <rect x="235" y="322" width="330" height="48" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
        <circle cx="255" cy="346" r="10" fill="#7c3aed" fill-opacity="0.25"/>
        <rect x="274" y="339" width="160" height="7" rx="3.5" fill="#7c3aed"/>
        <rect x="274" y="352" width="220" height="5" rx="2.5" fill="#94a3b8"/>

        <!-- External Atmospheric Badges -->
        <circle cx="110" cy="250" r="32" fill="#ffffff" stroke="#ea580c" stroke-width="2" filter="url(#glow)"/>
        <text x="110" y="259" font-family="system-ui, sans-serif" font-size="22" text-anchor="middle">🌐</text>

        <circle cx="690" cy="250" r="32" fill="#ffffff" stroke="#7c3aed" stroke-width="2" filter="url(#glow)"/>
        <text x="690" y="259" font-family="system-ui, sans-serif" font-size="22" text-anchor="middle">📢</text>
        

  <!-- Bottom Educational Insight Caption Bar -->
  <g transform="translate(100, 435)">
    <rect x="0" y="0" width="600" height="38" rx="12" fill="#ffffff" fill-opacity="0.9" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
    <rect x="12" y="10" width="5" height="18" rx="2.5" fill="url(#accentGrad)"/>
    <text x="28" y="24" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#475569">
      Theme Focus: Unverified claims and peer smear campaigns
    </text>
  </g>
</svg>