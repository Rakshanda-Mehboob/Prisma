<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0891b2" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Environment Canvas Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>

  <!-- Top Header Scene Pill -->
  <g transform="translate(35, 18)">
    <rect x="0" y="0" width="380" height="42" rx="21" fill="#ffffff" stroke="#0891b2" stroke-width="1.8" filter="url(#shadow)"/>
    <circle cx="21" cy="21" r="12" fill="#0891b2" fill-opacity="0.14"/>
    <circle cx="21" cy="21" r="5" fill="#0891b2"/>
    <text x="42" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#0891b2">Social Exclusion &amp; Isolation</text>
  </g>

  <!-- Top Right Variant Counter Badge -->
  <g transform="translate(615, 20)">
    <rect x="0" y="0" width="150" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="20" cy="19" r="6" fill="#64748b"/>
    <text x="35" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#334155">Scene 3 of 6</text>
  </g>

  <!-- Core Scene Illustration Graphics -->
  
        <!-- Laptop Display with Document -->
        <rect x="170" y="80" width="460" height="280" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" filter="url(#cardShadow)"/>
        
        <!-- Doc Header -->
        <rect x="170" y="80" width="460" height="36" fill="#f8fafc" stroke="#e2e8f0" rx="10 10 0 0"/>
        <rect x="190" y="92" width="16" height="16" rx="2" fill="#0891b2"/>
        <text x="215" y="104" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#334155">Term_Project_Submission_v4.docx</text>
        
        <!-- Document Text Area Left Side -->
        <g transform="translate(195, 135)" fill="#94a3b8">
          <rect x="0" y="0" width="220" height="10" rx="2" fill="#0891b2"/>
          <rect x="0" y="18" width="240" height="6" rx="2"/>
          <rect x="0" y="30" width="230" height="6" rx="2"/>
          <rect x="0" y="42" width="210" height="6" rx="2"/>
          <rect x="0" y="62" width="180" height="6" rx="2"/>
          <rect x="0" y="74" width="220" height="6" rx="2"/>
          <!-- Highlighted Text Section with Comment Marker -->
          <rect x="0" y="94" width="240" height="22" rx="3" fill="rgba(8, 145, 178, 0.15)"/>
          <text x="10" y="109" font-family="sans-serif" font-size="10" fill="#0891b2">Section 3.2: Methodology (Added by Sana)</text>
        </g>

        <!-- Right Side Comment Stream Showing Unanswered Queries -->
        <g transform="translate(460, 135)" filter="url(#shadow)">
          <rect x="0" y="0" width="155" height="95" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="1.8"/>
          <circle cx="16" cy="18" r="8" fill="#0891b2" fill-opacity="0.2"/>
          <text x="30" y="21" font-family="sans-serif" font-size="10" font-weight="700" fill="#0891b2">Sana (You):</text>
          <text x="10" y="40" font-family="sans-serif" font-size="9.5" fill="#334155">"Can anyone review</text>
          <text x="10" y="54" font-family="sans-serif" font-size="9.5" fill="#334155">this before tomorrow?"</text>
          <line x1="8" y1="65" x2="145" y2="65" stroke="#e2e8f0"/>
          <text x="10" y="80" font-family="sans-serif" font-size="8.5" fill="#94a3b8">Seen by 3 members • No reply</text>
        </g>

        <!-- Cold Coffee Mug on Side -->
        <rect x="100" y="270" width="35" height="45" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
        <path d="M135 280 C145 280 145 300 135 300" stroke="#94a3b8" stroke-width="2.5" fill="none"/>
        

  <!-- Bottom Context Banner -->
  <g transform="translate(40, 435)">
    <rect x="0" y="0" width="720" height="44" rx="12" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="14" y="12" width="5" height="20" rx="2.5" fill="url(#accentGrad)"/>
    <text x="30" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b">
      Scenario Illustration: Ghosting and Deliberate Non-Response on Shared Document
    </text>
  </g>
</svg>