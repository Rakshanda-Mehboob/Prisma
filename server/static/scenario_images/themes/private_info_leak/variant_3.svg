<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef2f2"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#d97706" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Environment Canvas Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>

  <!-- Top Header Scene Pill -->
  <g transform="translate(35, 18)">
    <rect x="0" y="0" width="380" height="42" rx="21" fill="#ffffff" stroke="#d97706" stroke-width="1.8" filter="url(#shadow)"/>
    <circle cx="21" cy="21" r="12" fill="#d97706" fill-opacity="0.14"/>
    <circle cx="21" cy="21" r="5" fill="#d97706"/>
    <text x="42" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#d97706">Confidential Info Leak</text>
  </g>

  <!-- Top Right Variant Counter Badge -->
  <g transform="translate(615, 20)">
    <rect x="0" y="0" width="150" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="20" cy="19" r="6" fill="#dc2626"/>
    <text x="35" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#334155">Scene 3 of 6</text>
  </g>

  <!-- Core Scene Illustration Graphics -->
  
        <!-- Door Frame Background Perspective -->
        <rect x="160" y="80" width="480" height="290" fill="#334155" rx="4"/>
        <!-- Cracked Open Door -->
        <path d="M160 80 L360 110 L360 370 L160 370 Z" fill="#1e293b"/>

        <!-- Glimpse of Private Hostel Room -->
        <rect x="360" y="110" width="280" height="260" fill="#fef3c7"/>
        <!-- Single Bed -->
        <rect x="420" y="220" width="200" height="60" rx="4" fill="#cbd5e1" stroke="#94a3b8"/>
        <rect x="580" y="215" width="35" height="30" rx="4" fill="#ffffff"/>
        <!-- Study Desk with family photo -->
        <rect x="380" y="260" width="80" height="70" fill="#b45309"/>
        <rect x="390" y="235" width="25" height="25" rx="2" fill="#ffffff" stroke="#d97706"/>

        <!-- Invasive Smartphone in Foreground Snap -->
        <g transform="translate(260, 160)" filter="url(#cardShadow)">
          <rect x="0" y="0" width="90" height="150" rx="14" fill="#0f172a" stroke="#dc2626" stroke-width="2.5"/>
          <rect x="6" y="12" width="78" height="110" rx="6" fill="#1e293b"/>
          <circle cx="45" cy="65" r="22" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,2"/>
          <!-- Flashing recording light -->
          <circle cx="70" cy="24" r="5" fill="#ef4444"/>
          <text x="45" y="110" font-family="sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">CAPTURED</text>
        </g>
        

  <!-- Bottom Context Banner -->
  <g transform="translate(40, 435)">
    <rect x="0" y="0" width="720" height="44" rx="12" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="14" y="12" width="5" height="20" rx="2.5" fill="url(#accentGrad)"/>
    <text x="30" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b">
      Scenario Illustration: Hostel Room Candid Photos Taken Without Permission
    </text>
  </g>
</svg>