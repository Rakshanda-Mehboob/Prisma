<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#fdf2f8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#9333ea" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Environment Canvas Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>

  <!-- Top Header Scene Pill -->
  <g transform="translate(35, 18)">
    <rect x="0" y="0" width="380" height="42" rx="21" fill="#ffffff" stroke="#9333ea" stroke-width="1.8" filter="url(#shadow)"/>
    <circle cx="21" cy="21" r="12" fill="#9333ea" fill-opacity="0.14"/>
    <circle cx="21" cy="21" r="5" fill="#9333ea"/>
    <text x="42" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#9333ea">Humiliating Visual Media</text>
  </g>

  <!-- Top Right Variant Counter Badge -->
  <g transform="translate(615, 20)">
    <rect x="0" y="0" width="150" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="20" cy="19" r="6" fill="#db2777"/>
    <text x="35" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#334155">Scene 2 of 6</text>
  </g>

  <!-- Core Scene Illustration Graphics -->
  
        <!-- Library Study Carrel -->
        <rect x="180" y="100" width="440" height="260" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="3" filter="url(#cardShadow)"/>
        
        <!-- Open Textbooks on Desk -->
        <rect x="250" y="250" width="140" height="60" rx="4" fill="#ffffff" stroke="#94a3b8"/>
        <line x1="320" y1="250" x2="320" y2="310" stroke="#cbd5e1" stroke-width="2"/>

        <!-- Student Sleeping Face Down on Textbooks -->
        <g transform="translate(300, 170)">
          <circle cx="35" cy="45" r="24" fill="#fed7aa"/>
          <path d="M15 35 Q35 20 55 35 Z" fill="#1e293b"/>
          <rect x="10" y="65" width="65" height="45" rx="8" fill="#9333ea"/>
          <!-- ZZZ floating -->
          <text x="80" y="25" font-family="sans-serif" font-size="16" font-weight="700" fill="#94a3b8">Z z z</text>
        </g>

        <!-- Prankster Snapping Selfie with Sleeping Student in Background -->
        <g transform="translate(480, 130)" filter="url(#cardShadow)">
          <circle cx="40" cy="35" r="26" fill="#fed7aa"/>
          <path d="M15 25 Q40 8 65 25 Z" fill="#0f172a"/>
          <!-- Pointing camera backwards laughing -->
          <rect x="15" y="80" width="70" height="120" rx="10" fill="#0f172a" stroke="#db2777" stroke-width="2"/>
          <circle cx="50" cy="110" r="16" fill="#db2777" fill-opacity="0.3"/>
          <circle cx="50" cy="95" r="3" fill="#ef4444"/>
          <!-- Flash Burst -->
          <polygon points="50,75 55,85 65,85 58,92 60,102 50,96 40,102 42,92 35,85 45,85" fill="#fef08a"/>
        </g>
        

  <!-- Bottom Context Banner -->
  <g transform="translate(40, 435)">
    <rect x="0" y="0" width="720" height="44" rx="12" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="14" y="12" width="5" height="20" rx="2.5" fill="url(#accentGrad)"/>
    <text x="30" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b">
      Scenario Illustration: Sneaking a Candid Photo of a Sleeping Student
    </text>
  </g>
</svg>