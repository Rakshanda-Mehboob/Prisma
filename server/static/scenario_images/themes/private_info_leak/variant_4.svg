    <circle cx="18" cy="17" r="5" fill="#dc2626"/>
    <text x="32" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#475569">Scene 4 of 6</text>
  </g>

  <!-- Core Scene Illustration Graphics -->
  
        <!-- Sound Recording Audio Player Interface -->
