<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef2f2"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#d97706" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Environment Canvas Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>

  <!-- Top Header Scene Pill -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="360" height="38" rx="19" fill="#ffffff" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="20" cy="19" r="11" fill="#d97706" fill-opacity="0.14"/>
    <circle cx="20" cy="19" r="4.5" fill="#d97706"/>
    <text x="40" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#d97706">Confidential Info Leak</text>
  </g>

  <!-- Top Right Variant Counter Badge -->
  <g transform="translate(630, 26)">
