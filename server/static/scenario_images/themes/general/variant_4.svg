<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563eb" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Environment Canvas Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>

  <!-- Top Header Scene Pill -->
  <g transform="translate(35, 18)">
    <rect x="0" y="0" width="380" height="42" rx="21" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow)"/>
    <circle cx="21" cy="21" r="12" fill="#2563eb" fill-opacity="0.14"/>
    <circle cx="21" cy="21" r="5" fill="#2563eb"/>
    <text x="42" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#2563eb">Cyberbullying Awareness &amp; Safety</text>
  </g>

  <!-- Top Right Variant Counter Badge -->
  <g transform="translate(615, 20)">
    <rect x="0" y="0" width="150" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="20" cy="19" r="6" fill="#059669"/>
    <text x="35" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#334155">Scene 4 of 6</text>
  </g>

  <!-- Core Scene Illustration Graphics -->
  
        <!-- Student Desk with Laptop and Desk Lamp -->
        <rect x="180" y="80" width="440" height="280" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" filter="url(#cardShadow)"/>
        
        <!-- Desk Lamp on Left Glowing -->
        <path d="M210 270 L210 140 L240 140" fill="none" stroke="#475569" stroke-width="4"/>
        <path d="M230 135 L260 145 L245 160 Z" fill="#f59e0b"/>
        <polygon points="245,160 350,300 200,300" fill="#fef08a" fill-opacity="0.12"/>

        <!-- Laptop Screen: Structured Evidence Folder -->
        <g transform="translate(270, 110)">
          <rect x="0" y="0" width="280" height="180" rx="8" fill="#1e293b"/>
          <!-- Folder Banner -->
          <rect x="0" y="0" width="280" height="30" rx="8 8 0 0" fill="#0f172a"/>
          <text x="25" y="20" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#059669">📁 Case_Evidence_Backup [Secured]</text>

          <!-- Verified Items List -->
          <g transform="translate(15, 45)" font-family="monospace" font-size="10">
            <rect x="0" y="0" width="250" height="25" rx="3" fill="#334155"/>
            <text x="10" y="16" fill="#38bdf8">✓ screenshot_threat_01_timestamp.png</text>
            
            <rect x="0" y="32" width="250" height="25" rx="3" fill="#334155"/>
            <text x="10" y="48" fill="#38bdf8">✓ batch_chat_export_log.txt</text>

            <rect x="0" y="64" width="250" height="25" rx="3" fill="#334155"/>
            <text x="10" y="80" fill="#38bdf8">✓ user_profile_id_proof.pdf</text>
          </g>

          <text x="140" y="165" font-family="sans-serif" font-size="9" fill="#10b981" text-anchor="middle">Ready for Student Grievance Submission</text>
        </g>
        

  <!-- Bottom Context Banner -->
  <g transform="translate(40, 435)">
    <rect x="0" y="0" width="720" height="44" rx="12" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="14" y="12" width="5" height="20" rx="2.5" fill="url(#accentGrad)"/>
    <text x="30" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b">
      Scenario Illustration: Systematic Preservation of Timestamps and Evidence
    </text>
  </g>
</svg>