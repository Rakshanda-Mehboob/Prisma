<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="prisma-shield-bg" x1="24" y1="5" x2="24" y2="43" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1530" />
      <stop offset="100%" stop-color="#050816" />
    </linearGradient>
    <linearGradient id="prisma-shield-stroke" x1="7" y1="5" x2="41" y2="43" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="prisma-glass" x1="14" y1="12" x2="34" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.28" />
    </linearGradient>
    <linearGradient id="prisma-beam-in" x1="6" y1="24.5" x2="18.5" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#00f5ff" />
    </linearGradient>
    <linearGradient id="prisma-ray-cyan" x1="27.5" y1="19" x2="41" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="prisma-ray-blue" x1="29.5" y1="23" x2="41" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="prisma-ray-violet" x1="31.5" y1="27" x2="39" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <!-- Protective Cyber Shield Silhouette -->
  <path
    d="M 24 5 L 41 12 C 41 26.5 32.5 37 24 43 C 15.5 37 7 26.5 7 12 Z"
    fill="url(#prisma-shield-bg)"
    stroke="url(#prisma-shield-stroke)"
    stroke-width="1.8"
    stroke-linejoin="round"
  />

  <!-- Incident Light Beam -->
  <line
    x1="6.5" y1="24.5"
    x2="18.2" y2="23"
    stroke="url(#prisma-beam-in)"
    stroke-width="2.2"
    stroke-linecap="round"
  />

  <!-- Internal Refraction Paths -->
  <path
    d="M 18.2 23 L 27.7 19"
    stroke="#00f5ff"
    stroke-width="1.2"
    stroke-opacity="0.65"
  />
  <path
    d="M 18.2 23 L 29.8 23"
    stroke="#38bdf8"
    stroke-width="1.2"
    stroke-opacity="0.65"
  />
  <path
    d="M 18.2 23 L 31.9 27"
    stroke="#a78bfa"
    stroke-width="1.2"
    stroke-opacity="0.65"
  />

  <!-- Dispersed Spectrum Rays (Refraction) -->
  <line
    x1="27.7" y1="19"
    x2="41" y2="16"
    stroke="url(#prisma-ray-cyan)"
    stroke-width="2.2"
    stroke-linecap="round"
  />
  <line
    x1="29.8" y1="23"
    x2="41" y2="23"
    stroke="url(#prisma-ray-blue)"
    stroke-width="2.2"
    stroke-linecap="round"
  />
  <line
    x1="31.9" y1="27"
    x2="39" y2="30"
    stroke="url(#prisma-ray-violet)"
    stroke-width="2.2"
    stroke-linecap="round"
  />

  <!-- Triangular Geometric Prism Body -->
  <polygon
    points="24,12 34,31 14,31"
    fill="url(#prisma-glass)"
    stroke="#00f5ff"
    stroke-width="1.6"
    stroke-opacity="0.85"
    stroke-linejoin="round"
  />

  <!-- Precision Focal Nodes -->
  <circle cx="24" cy="12" r="1.4" fill="#ffffff" />
  <circle cx="18.2" cy="23" r="1.2" fill="#ffffff" />
</svg>
