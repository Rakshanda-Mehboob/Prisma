<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0891b2" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Environment Canvas Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>

  <!-- Top Header Scene Pill -->
  <g transform="translate(35, 18)">
    <rect x="0" y="0" width="380" height="42" rx="21" fill="#ffffff" stroke="#0891b2" stroke-width="1.8" filter="url(#shadow)"/>
    <circle cx="21" cy="21" r="12" fill="#0891b2" fill-opacity="0.14"/>
    <circle cx="21" cy="21" r="5" fill="#0891b2"/>
    <text x="42" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#0891b2">Social Exclusion &amp; Isolation</text>
  </g>

  <!-- Top Right Variant Counter Badge -->
  <g transform="translate(615, 20)">
    <rect x="0" y="0" width="150" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="20" cy="19" r="6" fill="#64748b"/>
    <text x="35" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#334155">Scene 6 of 6</text>
  </g>

  <!-- Core Scene Illustration Graphics -->
  
        <!-- Portal Submission Frame -->
        <rect x="180" y="80" width="440" height="280" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="3" filter="url(#cardShadow)"/>
        
        <!-- Portal Top Banner -->
        <rect x="180" y="80" width="440" height="45" rx="12 12 0 0" fill="#0891b2"/>
        <text x="210" y="108" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">LMS Assignment Submission #4</text>
        
        <!-- Submitted Group Members List -->
        <g transform="translate(210, 145)">
          <text x="0" y="15" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f172a">Registered Group Contributors:</text>
          
          <rect x="0" y="30" width="380" height="32" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
          <text x="14" y="50" font-family="sans-serif" font-size="10.5" fill="#334155">1. Usman Ghani (Lead Author)</text>
          
          <rect x="0" y="70" width="380" height="32" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
          <text x="14" y="90" font-family="sans-serif" font-size="10.5" fill="#334155">2. Fatima Noor (Contributor)</text>

          <!-- Missing / Stricken 3rd member alert -->
          <rect x="0" y="110" width="380" height="42" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
          <text x="14" y="128" font-family="sans-serif" font-size="10" font-weight="700" fill="#dc2626">Missing: Member 3 not included in final upload</text>
          <text x="14" y="142" font-family="sans-serif" font-size="9" fill="#7f1d1d">Status: Grade will not be applied to excluded student</text>
        </g>

        <!-- Lockout Icon Right Corner -->
        <circle cx="560" cy="115" r="16" fill="#ffffff"/>
        <text x="560" y="121" font-family="sans-serif" font-size="14" text-anchor="middle">🔒</text>
        

  <!-- Bottom Context Banner -->
  <g transform="translate(40, 435)">
    <rect x="0" y="0" width="720" height="44" rx="12" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="14" y="12" width="5" height="20" rx="2.5" fill="url(#accentGrad)"/>
    <text x="30" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b">
      Scenario Illustration: Omission from Final Project Submission Portal
    </text>
  </g>
</svg>