<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#fdf2f8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#9333ea" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Environment Canvas Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>

  <!-- Top Header Scene Pill -->
  <g transform="translate(35, 18)">
    <rect x="0" y="0" width="380" height="42" rx="21" fill="#ffffff" stroke="#9333ea" stroke-width="1.8" filter="url(#shadow)"/>
    <circle cx="21" cy="21" r="12" fill="#9333ea" fill-opacity="0.14"/>
    <circle cx="21" cy="21" r="5" fill="#9333ea"/>
    <text x="42" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#9333ea">Humiliating Visual Media</text>
  </g>

  <!-- Top Right Variant Counter Badge -->
  <g transform="translate(615, 20)">
    <rect x="0" y="0" width="150" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="20" cy="19" r="6" fill="#db2777"/>
    <text x="35" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#334155">Scene 3 of 6</text>
  </g>

  <!-- Core Scene Illustration Graphics -->
  
        <!-- Graphic Tablet Canvas -->
        <rect x="170" y="80" width="460" height="280" rx="10" fill="#1e293b" stroke="#334155" stroke-width="4" filter="url(#cardShadow)"/>
        
        <!-- Software Top Menu -->
        <rect x="170" y="80" width="460" height="30" fill="#0f172a" rx="10 10 0 0"/>
        <text x="190" y="100" font-family="sans-serif" font-size="10" fill="#94a3b8">PhotoEdit Suite - [student_id_manipulation.psd]</text>

        <!-- Canvas Left: Cropped Student ID Face -->
        <rect x="210" y="130" width="110" height="130" rx="6" fill="#ffffff" stroke="#db2777" stroke-width="2"/>
        <circle cx="265" cy="180" r="28" fill="#fed7aa"/>
        <!-- Dotted cut-out line around face -->
        <circle cx="265" cy="180" r="34" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3"/>
        <text x="265" y="245" font-family="sans-serif" font-size="9" fill="#dc2626" text-anchor="middle">Face Cut-Out</text>

        <!-- Canvas Right: Derogatory Body Being Merged -->
        <g transform="translate(360, 130)">
          <rect x="0" y="0" width="160" height="150" rx="6" fill="#2d3748" stroke="#4a5568"/>
          <!-- Cartoonish body mockup -->
          <circle cx="80" cy="50" r="28" fill="#fed7aa" stroke="#dc2626" stroke-width="2"/>
          <text x="80" y="55" font-family="sans-serif" font-size="16" text-anchor="middle">🤡</text>
          <path d="M40 85 Q80 130 120 85 Z" fill="#f59e0b"/>
          <text x="80" y="130" font-family="sans-serif" font-size="9.5" fill="#fecaca" text-anchor="middle">Meme Export Preset</text>
        </g>
        

  <!-- Bottom Context Banner -->
  <g transform="translate(40, 435)">
    <rect x="0" y="0" width="720" height="44" rx="12" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="14" y="12" width="5" height="20" rx="2.5" fill="url(#accentGrad)"/>
    <text x="30" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b">
      Scenario Illustration: Fabricating Derogatory Memes via Photo-Editing Software
    </text>
  </g>
</svg>